version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: flightglobe_postgres
    environment:
      POSTGRES_USER: flightglobe
      POSTGRES_PASSWORD: flightglobe_password
      POSTGRES_DB: flightglobe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flightglobe_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
